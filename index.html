    <script>
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var _fetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore
        }
      })();
    </script>
